{% extends "base.html" %}
{% set logged_in = true %}

{% block title %}DEAD System &middot; Fail-Safe Settings{% endblock %}

{% block content %}
<main class="page">
  <header class="page__header">
    <h1>Fail-Safe Configuration</h1>
    <p class="page__subtitle">Define what happens to your assets if all next of kin decline or cannot be reached.</p>
  </header>

  <div class="panel">
    <form id="failsafe-form" class="auth-form">
      <label class="field">
        <span class="field__label">Primary Fail-Safe Option</span>
        <select name="primary_option" class="field__select">
          <option value="charity" selected>Charity / Non-Profit Organization</option>
          <option value="government">Government Treasury</option>
        </select>
      </label>

      <label class="field">
        <span class="field__label">Organization / Entity Name</span>
        <input type="text" name="primary_details" required value="Red Cross Kenya" placeholder="e.g. Red Cross, UNICEF" />
      </label>

      <label class="field">
        <span class="field__label">Additional Details</span>
        <textarea name="primary_description" rows="3" style="border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:11px 14px;font-size:14px;font-family:inherit;color:var(--color-text);background:var(--color-bg);width:100%;resize:vertical;">Donate all unclaimed digital and financial assets to support humanitarian efforts in Kenya.</textarea>
      </label>

      <hr style="border:none;border-top:1px solid var(--color-border);margin:24px 0;" />

      <label class="field">
        <span class="field__label">Secondary Fail-Safe Option</span>
        <select name="secondary_option" class="field__select">
          <option value="charity">Charity / Non-Profit Organization</option>
          <option value="government" selected>Government Treasury</option>
        </select>
      </label>

      <label class="field">
        <span class="field__label">Entity Name</span>
        <input type="text" name="secondary_details" required value="Kenya Revenue Authority" placeholder="e.g. Ministry of Finance" />
      </label>

      <label class="field">
        <span class="field__label">Additional Details</span>
        <textarea name="secondary_description" rows="3" style="border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:11px 14px;font-size:14px;font-family:inherit;color:var(--color-text);background:var(--color-bg);width:100%;resize:vertical;">Transfer assets to the national treasury for public fund allocation.</textarea>
      </label>

      <button type="submit" class="btn btn--primary">Save Fail-Safe Settings</button>
    </form>
    <p id="failsafe-message" class="auth-success" hidden></p>
  </div>
</main>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/failsafe.js') }}"></script>
{% endblock %}
