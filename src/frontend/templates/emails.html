<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estate Access · Asset Findings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <style>
    .email-list {
      display: grid;
      gap: 12px;
    }

    .email-item {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      background: var(--color-surface);
    }

    .email-item__subject {
      margin: 0 0 4px;
      font-weight: 600;
      font-size: 15px;
    }

    .email-item__meta {
      margin: 0;
      color: var(--color-text-muted);
      font-size: 13px;
    }

    .email-item__snippet {
      margin: 10px 0 0;
      font-size: 14px;
      line-height: 1.45;
    }

    .badge {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #eef6ff;
      color: #24508f;
      font-size: 12px;
      font-weight: 600;
    }

    .progress-wrap {
      display: none;
      gap: 8px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--color-text-muted);
    }

    .progress-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: #e6edf7;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #1f9d8f 0%, #24508f 100%);
      transition: width 0.25s ease;
    }

    .result-banner {
      display: none;
    }

    .decision-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }

    .decision-btn {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid var(--color-border);
      background: #fff;
      color: var(--color-text);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }

    .decision-btn:hover {
      transform: translateY(-1px);
    }

    .decision-btn[data-decision="confirm"] {
      color: #0f7a53;
      border-color: #7bc6aa;
    }

    .decision-btn[data-decision="deny"] {
      color: #a23a3a;
      border-color: #d4a0a0;
    }

    .decision-btn.is-active {
      background: #eaf8f1;
      border-color: #0f7a53;
      box-shadow: 0 0 0 2px rgba(15, 122, 83, 0.15);
    }

    .decision-btn[data-decision="deny"].is-active {
      background: #fff0f0;
      border-color: #a23a3a;
      box-shadow: 0 0 0 2px rgba(162, 58, 58, 0.15);
    }

    .decision-state {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-muted);
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar__brand">
      <span class="navbar__logo">◈</span>
      <span>Estate Access</span>
    </div>
    <div class="navbar__links">
      <a href="{{ url_for('index') }}" class="navbar__link">Dashboard</a>
      <a href="{{ url_for('register_page') }}" class="navbar__link">Register</a>
      <a href="{{ url_for('verify_page') }}" class="navbar__link">Verify</a>
      <a href="{{ url_for('scan_email') }}" class="navbar__link navbar__link--active">Scan Email</a>
    </div>
  </nav>

  <main class="page">
    <header class="page__header">
      <h1>Digital Asset Findings</h1>
      <p class="page__subtitle">Showing inbox emails classified as potential digital or financial assets.</p>
    </header>

    <section class="panel" style="display: grid; gap: 14px;">
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button id="scan-trigger" class="btn btn--primary" type="button">Scan Inbox</button>
        <a href="{{ url_for('scan_email') }}" class="btn btn--ghost">Back</a>
      </div>

      <div id="scan-progress" class="progress-wrap">
        <div class="progress-meta">
          <span id="scan-status">Starting scan...</span>
          <span id="scan-percent">0%</span>
        </div>
        <div class="progress-track">
          <div id="scan-fill" class="progress-fill"></div>
        </div>
      </div>

      <p id="scan-error" class="result-banner result-banner--error"></p>

      <div id="findings-container" class="email-list"></div>
      <p id="empty-findings" style="display: none;">No qualifying digital-asset findings were returned.</p>
    </section>
  </main>

  <script src="{{ url_for('static', filename='js/emails.js') }}"></script>
</body>
</html>
