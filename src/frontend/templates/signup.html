{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__header">
      <div class="auth-card__logo">D</div>
      <h1>Create your account</h1>
      <p>Register as a primary asset holder</p>
    </div>

    <form action="{{ url_for('login_page') }}" method="GET">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Full name</label>
          <input type="text" class="form-control" value="Rising Lazarus" required>
        </div>
        <div class="form-group">
          <label class="form-label">Country</label>
          <select class="form-control" required>
            <option value="">Select country</option>
            <option value="RW" selected>Rwanda</option>
            <option value="KE">Kenya</option>
            <option value="NG">Nigeria</option>
            <option value="GH">Ghana</option>
            <option value="ZA">South Africa</option>
            <option value="UG">Uganda</option>
            <option value="TZ">Tanzania</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">National ID / Passport</label>
        <input type="text" class="form-control" placeholder="e.g. 1 1998 1234567 8" required>
      </div>

      <div class="form-group">
        <label class="form-label">Email address</label>
        <input type="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" placeholder="Min. 8 characters" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="form-label">Confirm password</label>
          <input type="password" class="form-control" placeholder="Repeat password" required>
        </div>
      </div>

      <label class="form-check" style="margin:20px 0;">
        <input type="checkbox" checked>
        <span>I consent to asset discovery via email metadata scanning</span>
      </label>

      <button type="submit" class="btn btn-primary btn-block btn-lg">Create account</button>
    </form>

    <p class="auth-footer">
      Already have an account? <a href="{{ url_for('login_page') }}">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
