{% extends "base.html" %}
{% block title %}Sign In{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__header">
      <div class="auth-card__logo">D</div>
      <h1>Welcome back</h1>
      <p>Sign in to manage your digital estate</p>
    </div>

    <button type="button" id="google-btn" class="btn btn-google btn-block">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Sign in with Google
    </button>

    <div class="divider-text">or</div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label">Email address</label>
        <input type="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
      </div>

      <div class="flex justify-between items-center" style="margin: 16px 0;">
        <label class="form-check">
          <input type="checkbox"> Remember me
        </label>
        <a href="#" style="font-size:13px;color:var(--danger);font-weight:500;">Forgot password?</a>
      </div>

      <button type="button" id="auth-trigger" class="btn btn-primary btn-block btn-lg">Sign in</button>
    </form>

    <div id="oauth-section" class="oauth-section" style="display:none;">
      <div class="oauth-section__icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </div>
      <h3>Connect Gmail</h3>
      <p>Access to read metadata, to update asset discovery</p>
      <a href="{{ url_for('dashboard_page') }}" class="btn btn-primary btn-block">Authorize Access</a>
    </div>

    <p class="auth-footer">
      Don't have an account? <a href="{{ url_for('signup_page') }}">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
